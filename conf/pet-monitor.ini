; pet-monitor 配置模板。
; 相对路径接到 [base] dir 后面。以 / 开头的原样使用。
; 相机地址、检测区域和发信账号换成自己的，不要提交真实值。

[base]
dir = /opt/pet-monitor

; [camera] 是各路共用的项。transport 取 tcp 或 udp。
; 每一路写成 [camera.名字]。
; place 取 eat、litter、living、客厅、balcony、阳台。
; algo 取 detect、track、recognize、cat。缺省 cat。
; score_min 缺省用 [algo] 的 score_min。
; roi = x,y,w,h，单位是原图像素。只约束一只猫的停留判断。没写就看整幅画面。
[camera]
timeout_ms = 5000
transport = tcp

[camera.food]
url = rtsp://192.168.1.20:554/stream1
place = eat
algo = cat
score_min = 0.25
roi = 100,100,800,600

[camera.litter]
url = rtsp://192.168.1.21:554/stream1
place = litter
algo = cat
score_min = 0.25
roi = 200,200,640,480

[media]
jpeg_quality = 80
codec = h264
format = nv12
width = 1920
height = 1080
fps = 25
gop = 50
rc = cbr
bitrate = 2000000
qp_init = 26
qp_min = 10
qp_max = 51
profile = high
level = 40

[algo]
detect_model = models/yolov5s-640-640.rknn
track_model = models/yolov5s-640-640.rknn
cat_model = models/Catto.rknn
score_min = 0.25
nms_iou = 0.45
queue_depth = 2
dev_id = 0

; present_sec：区域内一只猫连续停留这么久才发，发出的是 shot_sec 那一张。
; pair_sec：全画面两只及以上连续出现这么久才发当前帧。
; cooldown_sec：发出去之后这么久以内不再发，结束时重新计。
; shot_dir：JPEG 目录。absent_sec 仍读入，再发间隔以 cooldown_sec 为准。
[event]
eat_sec = 3
litter_sec = 5
clip_sec = 10
present_sec = 20
shot_sec = 10
absent_sec = 20
pair_sec = 3
cooldown_sec = 600
shot_dir = shots

; tls 取 auto、implicit、starttls、none。enable 为 true 时 host、from、to 不能空。
[email]
enable = false
host = smtp.qq.com
port = 465
tls = implicit
username =
password =
from =
to =
ca_file =
insecure = false
timeout_ms = 30000
