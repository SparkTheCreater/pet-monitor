; pet-monitor
; 相对路径接到 [base] dir 后面。以 / 开头的原样使用。
; [camera] 是各路相机共用的项。transport 取 tcp 或 udp。每一路写成 [camera.名字]。

[base]
dir = /opt/pet-monitor

[camera]
timeout_ms = 5000
transport = tcp

[camera.food]
url = rtsp://192.168.1.20:554/stream1
place = eat
algo = cat
score_min = 0.25

[camera.litter]
url = rtsp://192.168.1.21:554/stream1
place = litter
algo = cat
score_min = 0.25

[media]
jpeg_quality = 80
codec = h264
format = nv12
width = 1920
height = 1080
fps = 25
gop = 50
rc = cbr
bitrate = 2000000
qp_init = 26
qp_min = 10
qp_max = 51
profile = high
level = 40

[algo]
detect_model = models/yolov5s-640-640.rknn
track_model = models/yolov5s-640-640.rknn
cat_model = models/Catto.rknn
score_min = 0.25
nms_iou = 0.45
queue_depth = 2
dev_id = 0

[event]
eat_sec = 3
litter_sec = 5
clip_sec = 10
present_sec = 20
shot_sec = 10
absent_sec = 20

[email]
enable = false
host = smtp.qq.com
port = 465
tls = implicit
username =
password =
from =
to =
ca_file =
insecure = false
timeout_ms = 30000
